<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<style>
/* ===== 色（純白ベース。ボタンだけ、上からの光で少し浮かせる） ===== */
:root{
  color-scheme:light;
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f3f5f4;
  --rule:#e3e8e5;--rule-2:#cdd6d1;
  --text:#17211d;--text-2:#46534d;--text-3:#6c7973;
  --accent:#2e6b53;--accent-ink:#ffffff;
  --danger:#b5442f;--danger-bg:#fbeae6;--danger-border:#ebc3b9;
  --warn:#8e6a1c;--warn-bg:#f8f1e0;--warn-border:#e8d6a8;
  --blue:#3f6590;
  --scrim:rgba(23,33,29,.4);
  --nav-bg:rgba(255,255,255,.9);
  --shadow:0 10px 30px rgba(23,33,29,.14),0 2px 6px rgba(23,33,29,.06);
  /* ボタンの立体感（白いボタン／緑のボタン／押したとき） */
  --btn-face:linear-gradient(180deg,#ffffff 0%,#f4f6f5 100%);
  --btn-raise:inset 0 1px 0 #ffffff,0 1px 1px rgba(23,33,29,.07),0 2px 5px rgba(23,33,29,.06);
  --btn-accent-face:linear-gradient(180deg,#38795f 0%,#2b6550 100%);
  --btn-accent-raise:inset 0 1px 0 rgba(255,255,255,.2),0 1px 1px rgba(16,48,36,.22),0 3px 7px rgba(16,48,36,.16);
  --btn-press:inset 0 1px 3px rgba(23,33,29,.16);
  --nav:62px;
  --navgap:max(calc(env(safe-area-inset-bottom) - 14px),10px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;background:var(--bg);}
/* iOS 26 のホーム画面アプリ（WebKit bug 301108）: ページが画面より低いと、画面の高さが
   ステータスバーの分だけ短くなり、下に空白ができる。ページを画面いっぱいの高さにして、
   iOS 側に画面の高さを広げさせる（JS で高さを足しても、短い位置で切られて効かない） */
@media (display-mode: standalone){
  html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)));}
}
html,body{margin:0;padding:0;overscroll-behavior:none;}
body{
  position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
  height:100vh;height:100dvh;height:var(--appH,100dvh);
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;
}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ヘッダ */
header{
  flex:none;background:var(--bg);color:var(--text);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 18px;
  border-bottom:1px solid var(--rule);
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;}
.htitle{font-size:15px;font-weight:700;letter-spacing:.02em;}
.hleft{display:flex;align-items:center;gap:10px;min-width:0;}
.hright{display:flex;align-items:center;gap:6px;}
.hlink{font-size:12px;font-weight:600;color:var(--text-2);text-decoration:none;border:1px solid var(--rule-2);border-radius:99px;padding:1px 9px;}
.hsync{display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:40px;padding:0;border:0;background:transparent;cursor:pointer;}
.hgear{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.hgear svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.hgear[aria-current="true"]{background:var(--surface-2);color:var(--text);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
.dot.off{background:var(--text-3);}
.dot.busy{background:var(--warn);animation:pulse 1s infinite;}
.dot.err{background:var(--danger);}
@keyframes pulse{50%{opacity:.3;}}
.hsum{display:flex;align-items:center;gap:10px;min-height:44px;}
.hsum .hleft{flex:1;min-width:0;display:flex;align-items:center;gap:8px;}
.hsum .lb{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hsum .v{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;}
.hsum .v small{font-size:14px;font-weight:700;margin-left:2px;}
.hsum .v.neg{color:var(--danger);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* 本体 */
main{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:16px 14px calc(var(--nav) + var(--navgap) + 28px);
}
main > .pane{max-width:540px;margin:0 auto;width:100%;}
main > .pane > *{max-width:100%;}
.pane{display:none;}
.pane.on{display:block;}
.lbl{font-size:14px;font-weight:800;color:var(--text);margin:0 0 9px 4px;}
.empty{text-align:center;padding:40px 10px;color:var(--text-3);font-size:14px;font-weight:600;}
.note{font-size:12.5px;color:var(--text-3);line-height:1.6;margin:8px 2px 0;}

/* 明細行 */
.item{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 13px;margin-bottom:9px;}
.item .top{display:flex;align-items:center;gap:10px;}
.item .shop{flex:1;min-width:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .amt{font-size:18px;font-weight:800;flex:none;}
.item .flag{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--danger);}
.dhead{margin:14px 4px 7px;font-size:14px;font-weight:800;color:var(--text);}
.dhead:first-child{margin-top:2px;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule-2);color:var(--text-2);}
.tag.cat{background:var(--text);color:var(--bg);border-color:var(--text);}
.tag.edit{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn);}
.tag.dup{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger);}

/* カテゴリチップ */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.chip{
  min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rule-2);
  background:var(--btn-face);box-shadow:var(--btn-raise);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.chip:active{background:var(--surface-2);box-shadow:var(--btn-press);}
.chip[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text);box-shadow:var(--btn-press);}
.chip.ghost{background:transparent;color:var(--text-3);border-style:dashed;box-shadow:none;}
.chip.ok{background:var(--btn-accent-face);color:var(--accent-ink);border-color:#275c47;box-shadow:var(--btn-accent-raise);}
.chip.ok:active{background:var(--accent);box-shadow:var(--btn-press);}
.chip.del{background:var(--btn-face);color:var(--danger);border-color:var(--danger-border);}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.chiprow .chip{flex:none;}
.chiprow .chip.hid{display:none;}
.chip.more{background:transparent;color:var(--text-3);border-style:dashed;box-shadow:none;}
.chipwrap{position:relative;}

/* 確認ダイアログ */
.confirm{position:fixed;top:0;left:0;right:0;height:var(--appH,100dvh);background:var(--scrim);z-index:70;
  display:none;align-items:center;justify-content:center;padding:20px;}
.confirm.on{display:flex;}
.cbox{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 18px 16px;max-width:340px;width:100%;
  box-shadow:var(--shadow);}
.cbox h4{margin:0 0 7px;font-size:16px;font-weight:800;}
.cbox p{margin:0 0 17px;font-size:13.5px;color:var(--text-2);font-weight:600;line-height:1.6;white-space:pre-line;}
.cbox .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.cbox button{min-height:48px;border-radius:999px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;}
.cbox .no{border:1px solid var(--rule-2);background:var(--btn-face);box-shadow:var(--btn-raise);color:var(--text-2);}
.cbox .yes{border:1px solid #9c3826;background:linear-gradient(180deg,#c04d37,#a93f2b);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 1px rgba(90,30,20,.2),0 3px 7px rgba(90,30,20,.14);}
.cbox button:active{box-shadow:var(--btn-press);}

/* スワイプ削除 */
.swipe{position:relative;overflow:hidden;border-radius:12px;margin-bottom:9px;background:var(--danger);}
.swipe > .del{
  position:absolute;top:0;right:0;bottom:0;width:96px;border:0;background:var(--danger);color:#fff;
  font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
}
.swipe .slide{position:relative;transition:transform .18s ease;will-change:transform;}
.swipe.dragging .slide{transition:none;}
.swipe .slide .item{margin-bottom:0;}
@media (hover:hover) and (pointer:fine){
  .swipe{background:transparent;}
  .swipe > .del{display:none;}
}

/* 月の合計 */
.calsum{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:11px;}
.cs-main{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;}
.cs-main .v{font-size:27px;font-weight:800;line-height:1.15;}
.cs-main .u{font-size:14px;font-weight:700;color:var(--text-2);}
.cs-pend{font-size:12.5px;font-weight:700;color:var(--warn);}
.cs-sub{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--rule);font-size:12px;font-weight:600;color:var(--text-3);}
.cs-sub b{font-size:14.5px;font-weight:800;color:var(--text);}

/* 円グラフ */
.pie-wrap{display:flex;justify-content:center;padding:4px 0 6px;}
.pie{width:270px;height:270px;max-width:100%;}
.pie path{cursor:pointer;}
.pie .plab{font-size:5.4px;font-weight:800;fill:var(--bg);text-anchor:middle;pointer-events:none;}
.pie .plab.on{font-size:6.4px;}
.pie path,.pie circle{transition:opacity .18s;}
.pietotal{text-align:center;font-size:12.5px;font-weight:700;color:var(--text-3);margin:0 0 12px;}
.pietotal b{font-size:20px;font-weight:800;color:var(--text);margin-left:6px;}

/* カテゴリ編集・凡例 */
.crow{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;padding:7px 9px;margin-bottom:7px;}
.crow .sw{width:12px;height:12px;border-radius:3px;flex:none;}
.crow .nm{flex:1;min-width:0;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crow button{width:40px;height:40px;flex:none;border:1px solid var(--rule-2);background:var(--btn-face);box-shadow:var(--btn-raise);
  border-radius:50%;font-size:15px;color:var(--text);cursor:pointer;padding:0;}
.crow button:disabled{opacity:.25;cursor:not-allowed;}
.crow button.x{color:var(--danger);border-color:var(--danger-border);}
.crow.fixed .nm{color:var(--text-3);}
.leg{display:flex;align-items:center;gap:9px;padding:9px 8px;border-bottom:1px solid var(--rule);cursor:pointer;border-radius:8px;}
.leg:last-child{border-bottom:0;}
.leg.sel{background:var(--surface);outline:2px solid var(--text);outline-offset:-2px;}
.leg .sw{width:12px;height:12px;border-radius:3px;flex:none;}
.leg .nm{flex:1;min-width:0;font-size:14px;font-weight:700;}
.leg .va{font-size:14px;font-weight:800;}
.leg .pc{font-size:12px;color:var(--text-3);font-weight:700;width:46px;text-align:right;}

/* ボタン */
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:52px;border:1px solid #275c47;border-radius:999px;
  background:var(--btn-accent-face);box-shadow:var(--btn-accent-raise);color:var(--accent-ink);
  font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;
}
.btn:active{background:var(--accent);box-shadow:var(--btn-press);transform:translateY(1px);}
.btn:disabled{background:var(--surface-2);border-color:var(--rule);box-shadow:none;color:var(--text-3);cursor:not-allowed;transform:none;}
.btn.sub{background:var(--btn-face);box-shadow:var(--btn-raise);color:var(--text-2);border:1px solid var(--rule-2);min-height:46px;font-size:14.5px;}
.btn.danger{background:var(--btn-face);box-shadow:var(--btn-raise);color:var(--danger);border:1px solid var(--danger-border);min-height:46px;font-size:14.5px;}
.btn.sub:active,.btn.danger:active{background:var(--surface-2);box-shadow:var(--btn-press);}
.hide{display:none!important;}

/* フォーム */
.f{margin-bottom:13px;}
.f > span{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px;}
input[type=text],input[type=number],input[type=date],input[type=time]{
  width:100%;max-width:100%;min-width:0;min-height:52px;padding:0 13px;
  border:1px solid var(--rule-2);border-radius:12px;-webkit-appearance:none;appearance:none;
  background:var(--surface);color:var(--text);font-family:inherit;font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
input:focus{outline:none;border-color:var(--accent);}
input.big{font-size:30px;font-weight:800;min-height:66px;text-align:right;}
input.amtin{
  width:112px;min-width:112px;max-width:112px;flex:0 0 112px;min-height:44px;padding:0 14px;
  border:1px solid var(--rule-2);border-radius:14px;background:var(--surface-2);
  font-size:19px;font-weight:800;text-align:right;
}
input.amtin:focus{border-color:var(--accent);background:var(--surface);}
input.amtin.chg{border-color:var(--warn);background:var(--warn-bg);}
input.rename{
  width:100%;min-height:44px;margin-top:10px;padding:0 12px;border:1px solid var(--rule-2);
  border-radius:10px;background:var(--surface-2);font-size:16px;font-weight:700;
}
input.rename:focus{border-color:var(--accent);background:var(--surface);}
input::placeholder{color:var(--text-3);font-weight:600;opacity:.8;}

/* カレンダー */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.cal-head button:active{box-shadow:var(--btn-press);}
.cal-head button{width:44px;height:44px;border:1px solid var(--rule-2);background:var(--btn-face);box-shadow:var(--btn-raise);border-radius:50%;
  font-size:17px;color:var(--text);cursor:pointer;}
.cal-head .m{font-size:17px;font-weight:800;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;}
.cal .dow{background:var(--surface-2);text-align:center;font-size:11px;font-weight:700;padding:5px 0;color:var(--text-3);}
.cal .dow.s{color:var(--danger);}
.cal .dow.t{color:var(--blue);}
.cal .d{background:var(--surface);min-height:52px;padding:3px 4px;text-align:right;cursor:pointer;}
.cal .d.out{background:var(--bg);opacity:.5;}
.cal .d.today .n{background:var(--text);color:var(--bg);border-radius:4px;padding:0 4px;}
.cal .d .n{font-size:11px;font-weight:700;color:var(--text-3);}
.cal .d .a{font-size:11px;font-weight:800;color:var(--text);line-height:1.25;margin-top:2px;word-break:break-all;}
.cal .d .pn{display:block;font-size:9.5px;font-weight:700;color:var(--warn);}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px;}

/* グラフ */
.bar{margin:0 -6px 11px;padding:2px 6px;border-radius:8px;}
.bar .r1{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px;}
.bar .r1 .p{color:var(--text-3);font-size:12px;font-weight:700;}
.bar .track{height:9px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.bar .fill{height:100%;background:var(--accent);border-radius:4px;}
#catBars .bar{cursor:pointer;}
#catBars .bar.sel{background:var(--surface);outline:2px solid var(--text);outline-offset:-2px;}

/* 下部ナビ */
nav{
  position:absolute;left:12px;right:12px;bottom:var(--navgap);
  max-width:516px;margin:0 auto;z-index:40;
  background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(150%) blur(18px);backdrop-filter:saturate(150%) blur(18px);
  border:1px solid var(--rule);border-radius:24px;
  box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);
}
nav button{
  height:var(--nav);border:0;background:transparent;color:var(--text-3);font-family:inherit;
  font-size:10.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;position:relative;min-width:0;white-space:nowrap;
}
nav button::before{
  content:"";position:absolute;inset:6px 4px;border-radius:18px;
  background:transparent;transition:background .16s;
}
nav button > *{position:relative;z-index:1;}
nav button .nl{display:block;line-height:1.2;}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
nav button[aria-current="true"]{color:var(--text);}
nav button[aria-current="true"]::before{background:var(--surface-2);}
nav button[aria-current="true"] svg{stroke-width:2;color:var(--accent);}
.badge{position:absolute;top:5px;right:50%;transform:translateX(22px);background:var(--warn);color:var(--bg);
  font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;padding:0 5px;
  display:flex;align-items:center;justify-content:center;}

/* モーダル */
.modal{position:fixed;left:0;top:0;width:100%;height:var(--appH,100dvh);
  background:var(--scrim);z-index:50;display:none;overscroll-behavior:contain;}
.modal.on{display:block;}
#modal{z-index:56;}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(100% - 28px);max-width:520px;max-height:calc(var(--appH,100dvh) - 40px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
.lbox{max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -3px;padding:0 3px;}
.sheet h3{margin:0;font-size:17px;font-weight:800;}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 12px;}
.shead b{font-size:17px;font-weight:800;white-space:nowrap;}
.sheet .sub{font-size:12.5px;color:var(--text-3);margin-bottom:14px;font-weight:600;}
.sheet .item{background:var(--surface-2);}
#lSub,#mSub,#mRawWrap{display:none;}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;}
.brow .btn{height:46px;min-height:46px;margin:0;}

.toast{position:absolute;left:50%;bottom:calc(var(--nav) + var(--navgap) + 14px);transform:translateX(-50%) translateY(14px);
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:88%;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* 計画タブ（中身は Shadow DOM 側で描く） */
#p-plan{max-width:620px;}
#planHost{display:block;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<header>
  <div class="hsum">
    <div class="hleft">
      <span class="lb" id="sumLabel">今月の支出</span>
      <!-- 資産管理アプリへのリンク。URLは設定画面で登録し端末内（localStorage）に保存。未登録なら出さない -->
      <a id="assetLink" class="hlink" href="#" target="_blank" rel="noopener" hidden>資産 ↗</a>
    </div>
    <div class="v num" id="sumBox"><span id="sumVal">0</span><small>円</small></div>

<!-- 計画タブの中身（Shadow DOM に入れるので、家計簿本体のスタイルとは混ざらない） -->
<template id="planTpl">
<style>
/* ===== 計画タブ（Shadow DOM の中）。色は家計簿本体の変数を受け継ぎ、ここでは計画用の色だけ足す ===== */
:host {
  display: block;
  --border: var(--rule);
  --ok: var(--accent);

  --series-fixed: #3f6590;

  --series-savings: #2e6b53;
  --series-reserve: #d3dbd7;
  --switch-off: var(--rule-2);
  --shadow: 0 1px 2px rgba(23,33,29,.04);
  --sign-ink: #fff;
  --tone-in: #8e6a1c;
  --tone-out: #b5442f;

  --tone-chart: #3f6590;

  font-size: 15px;
  line-height: 1.55;
}
*, *::before, *::after { box-sizing: border-box; }
/* iOS の自動拡大を防ぐため、入力欄は必ず 16px 以上 */
input, select, textarea, button { font: inherit; font-size: 16px; color: inherit; }
input, select, textarea {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
select { appearance: none; -webkit-appearance: none; padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
  background-size: 5px 5px; background-repeat: no-repeat; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.muted { color: var(--text-3); }
h1, h2, h3 { margin: 0; line-height: 1.3; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--rule-2);

  font-weight: 600; text-decoration: none;
}

.btn.primary:active { background: var(--accent); box-shadow: var(--btn-press); }

.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.icon-btn {
  flex: none; width: 40px; height: 40px; min-height: 40px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;

}

/* ===== レイアウト ===== */
.pbar { display: flex; align-items: center; gap: 8px; }

.pbar .btn { min-height: 46px; }
.subnav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; margin: 10px 0 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
.subnav a { display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 9px; color: var(--text-2); font-size: 14.5px; font-weight: 700; text-decoration: none; }
.subnav a[aria-current="page"] { background: var(--btn-face); color: var(--text); box-shadow: var(--btn-raise), 0 0 0 1px var(--rule); }

.sync-note a { color: inherit; font-weight: 700; }
.view { padding-top: 14px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text-2); margin: 24px 4px 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }

/* ===== ホーム ===== */
.hero-label { font-size: 13px; color: var(--text-2); font-weight: 600; }

  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5;
}

/* ＋ 入るお金 / − 出ていくお金 / 貯める / グラフ のグループ（グループごとに全体を色付け） */
.equation { font-size: 13px; color: var(--text-2); margin: -2px 0 12px; line-height: 1.6; }

.equation .in { color: var(--tone-in); }

.equation .save { color: var(--tone-save); }
.grp { --tone: var(--tone-chart); margin-top: 22px; }
.grp.tone-in { --tone: var(--tone-in); }
.grp.tone-out { --tone: var(--tone-out); }
.grp.tone-save { --tone: var(--tone-save); }
.grp { --div: color-mix(in srgb, var(--tone) 22%, var(--border)); }
.grp-head { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-size: 15px; font-weight: 750; color: var(--tone); }
.grp-total { margin-left: auto; font-size: 16px; }
.sign { flex: none; width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; line-height: 1; color: var(--sign-ink); background: var(--tone); }
.sign svg { width: 15px; height: 15px; }
.grp-card { background: color-mix(in srgb, var(--tone) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone) 30%, var(--border)); border-radius: 14px; overflow: hidden; }
.grp-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--div); font-size: 13px; color: var(--text-2); }
.grp-foot b { font-size: 16px; color: var(--text); }

.xrow + .xrow { border-top: 1px solid var(--div); }
.xhead { display: flex; align-items: stretch; }
.xtoggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 10px 4px 10px 16px; border: 0; background: transparent; color: inherit; text-align: left; font: inherit; }
.xtoggle .l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.xtoggle .t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 370px) { .xtoggle { gap: 8px; padding-left: 12px; } .xtoggle .v { font-size: 16px; } .edit-btn, .edit-ico { width: 44px; } .srow { padding-left: 30px; } .srow .sv { margin-right: 22px; } }
.xtoggle .s { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xtoggle .v { font-size: 18px; font-weight: 750; white-space: nowrap; }
.caret { flex: none; width: 22px; height: 22px; color: var(--text-3); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.xrow.open .caret { transform: rotate(180deg); }
.edit-btn { flex: none; width: 50px; display: flex; align-items: center; justify-content: center; color: var(--tone); text-decoration: none; }
.edit-btn svg, .edit-ico svg { width: 18px; height: 18px; }
.xbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s cubic-bezier(.2, .8, .2, 1); }

.xinner { min-height: 0; overflow: hidden; }

.sbar { display: block; height: 4px; margin-top: 5px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--tone) 12%, transparent); }
.sbar i { display: block; height: 100%; border-radius: 2px; }
.srow .sv { margin-right: 26px; font-size: 15px; font-weight: 650; white-space: nowrap; }
.edit-ico { flex: none; width: 50px; display: flex; justify-content: center; color: var(--tone); }

/* グラフ */

.leg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 4.2em 12px; gap: 10px; align-items: center; min-height: 44px; padding: 0 0 0 2px; color: inherit; text-decoration: none; border-top: 1px solid var(--border); }
.leg-row > .num { text-align: right; white-space: nowrap; }
.leg-row .lbl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.leg-row.neg { color: var(--danger); font-weight: 700; }

/* ===== 入力 ===== */
.mini-summary {
  position: sticky; top: 6px; z-index: 10;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px;
}
.mini-summary div { min-width: 0; }
.mini-summary .k { color: var(--text-2); font-weight: 600; }
.mini-summary .v { font-size: 15px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-summary.is-negative { border-color: var(--danger); background: var(--danger-bg); }
.mini-summary.is-negative .reserve .v, .mini-summary.is-negative .reserve .k { color: var(--danger); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 14px 0 12px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 0;
  padding: 6px 2px; min-height: 52px; border-radius: 12px;
  border: 1px solid var(--rule-2); background: var(--btn-face); box-shadow: var(--btn-raise); color: var(--text-2);
  font-size: 13px; font-weight: 700; line-height: 1.3;
}
.tab .n { font-size: 11px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--btn-accent-face); border-color: #275c47; box-shadow: var(--btn-accent-raise); color: var(--accent-ink); }
.tab[aria-selected="true"] .n { color: color-mix(in srgb, var(--accent-ink) 85%, transparent); }
.pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 4px 8px; }
.pane-head h2 { font-size: 18px; }
.pane-note { font-size: 13px; color: var(--text-3); margin: -4px 4px 10px; }
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.item.is-off { background: var(--surface-2); box-shadow: none; }
.item.is-off .fade { opacity: .5; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row > .grow { flex: 1 1 auto; min-width: 0; }
.amt-wrap { position: relative; flex: 0 0 8.2em; }
.amt-wrap::before { content: "¥"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.amt-wrap input { padding-left: 24px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }

@media (max-width: 370px) { .amt-wrap { flex-basis: 7em; } .payday { flex-basis: 5.6em; } }

.derived { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-2); padding: 0 4px; }
.derived b { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.sw { position: relative; flex: none; width: 46px; height: 28px; display: inline-block; }
.sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; min-height: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--switch-off); transition: background .15s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }

.sw input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.pane-foot { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 700; }
.total-row .v { font-size: 18px; }
.total-sub { font-size: 13px; color: var(--text-2); padding: 0 14px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.empty { text-align: center; color: var(--text-3); padding: 20px 8px; font-size: 14px; border: 1px dashed var(--border); border-radius: 14px; }
.next-step { display: flex; justify-content: flex-end; }
.seg-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 0 0 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
.seg-ctl button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-size: 15px; font-weight: 700; }
.seg-ctl button[aria-pressed="true"] { background: var(--btn-face); color: var(--text); box-shadow: var(--btn-raise), 0 0 0 1px var(--rule); }
.vt-label { font-weight: 650; }

/* ===== 設定 ===== */
.cat-list { list-style: none; margin: 0 0 10px; padding: 0; }
.cat-list li {
  position: relative; display: flex; align-items: center; gap: 2px; padding: 2px 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.cat-list li.dragging { z-index: 5; transition: box-shadow .2s; border-radius: 10px; border-bottom-color: transparent; box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 0 0 1px var(--border); }
.cat-list li.dropping { z-index: 5; transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s; }
.drag-handle { flex: none; width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: var(--text-3); cursor: grab; touch-action: none; }
.drag-handle svg { width: 20px; height: 20px; }
.drag-handle:focus-visible { outline: 2px solid var(--accent); }
.cat-list li.dragging .drag-handle { cursor: grabbing; color: var(--accent); }
.cat-list li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inline-form { display: flex; gap: 8px; }
.inline-form input { flex: 1; min-width: 0; }
.settings-actions { display: flex; flex-direction: column; gap: 10px; }
.help { font-size: 13px; color: var(--text-3); margin: 6px 0 0; }
details.card > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "＋"; color: var(--text-3); }
details.card[open] > summary::after { content: "－"; }
details.card[open] > summary { margin-bottom: 10px; }

/* ===== モーダル ===== */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0,0,0,.4); padding: 16px;
}
@media (min-width: 560px) { .overlay { align-items: center; } }
.sheet { width: 100%; max-width: 440px; background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.25); margin-bottom: env(safe-area-inset-bottom); }
.sheet h2 { font-size: 18px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--text-2); }
.field-row { display: flex; gap: 8px; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.error-text { color: var(--danger); font-size: 13px; min-height: 1.4em; margin: 4px 0 0; }

/* 説明文・計算式・補足の灰色文字は出さない */
.help, .pane-note, .pane-head, .chart-note, .chart-title .muted, .derived, .total-sub, .ss, .grp-head, .equation, .ba-sub, .ba-sum { display: none !important; }
.hero .status { margin-top: 10px; }

.mini-summary .reserve { display: flex; width: 100%; justify-content: space-between; align-items: baseline; }
.mini-summary .reserve .v { font-size: 18px; }
/* 丸みのある操作部品 */
.btn, .seg-ctl, .seg-ctl button, .subnav, .subnav a { border-radius: 999px !important; }
.tab { border-radius: 16px !important; }
.icon-btn { border-radius: 50% !important; }
input, select { border-radius: 14px; }
.pbar select { border-radius: 999px; padding-left: 18px; }
.ba-row.over .ba-val { color: var(--danger); }
.item [data-f="memo"] { min-height: 38px; border-color: transparent; background: transparent; padding: 8px 6px; font-size: 16px; line-height: 1.5; }
.item textarea[data-f="memo"] { display: block; resize: none; overflow: hidden; font: inherit; font-size: 16px; color: var(--text); border: 1px solid transparent; border-radius: 12px; }
/* メモを書いたら、その行の下に全幅で出す（空のときは同じ行に小さく） */
.row:has(> textarea[data-f="memo"]) { flex-wrap: wrap; }
.item textarea[data-f="memo"]:placeholder-shown { flex: 1 1 0; width: 0; }
.item textarea[data-f="memo"]:not(:placeholder-shown) { flex: 1 1 100%; width: 100%; order: 3; }

.item [data-f="memo"]:focus { border-color: var(--accent); background: var(--surface); }

/* 予算と実績（家計簿の明細から集計） */
.ba-row { display: block; padding: 10px 0; border-top: 1px solid var(--border); color: inherit; text-decoration: none; }
.ba-row:first-child { border-top: 0; }

.ba-track i { display: block; height: 100%; border-radius: 4px; background: var(--series-variable); }
.ba-row.over .ba-track i { background: var(--danger); }

.actual { color: var(--text-2); }

<script>
(function(){
"use strict";

/* ===== 保存領域 ===== */
var K_CFG='kakeibo-cfg',K_CACHE='kakeibo-cache',K_QUEUE='kakeibo-queue';
var mem={};
function ls(k,v){
  try{
    if(v===undefined){var s=localStorage.getItem(k);return s?JSON.parse(s):(mem[k]||null);}
    localStorage.setItem(k,JSON.stringify(v));
  }catch(e){ if(v===undefined) return mem[k]||null; mem[k]=v; }
}

var CFG=ls(K_CFG)||{url:'',token:'',days:90};
var DATA=ls(K_CACHE)||{items:[],cats:[],at:null};
var QUEUE=ls(K_QUEUE)||[];

var METHODS=['現金','Suica','PayPay','楽天ペイ','カード','その他'];
var RANGES=[[90,'3か月'],[365,'1年'],[1095,'3年'],[0,'全期間']];

var view={pane:'approve',month:monKey(new Date()),gmonth:monKey(new Date()),day:null,cat:null,
          ctype:(CFG.ctype||'pie')};
var editId=null,addCat='外食',addMethod='現金',mCat='',drafts={};

/* ===== 小物 ===== */
function $(i){return document.getElementById(i);}
function MAIN(){return document.querySelector('main');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function yen(n){return Math.round(Number(n)||0).toLocaleString();}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}
function monKey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
function dayKey(d){return monKey(d)+'-'+('0'+d.getDate()).slice(-2);}
function monShift(key,n){
  var y=+key.slice(0,4),m=+key.slice(5,7)-1+n;
  return monKey(new Date(y,m,1));
}
function monLabel(key){return key.slice(0,4)+'年'+(+key.slice(5,7))+'月';}
function cats(){return (DATA.cats&&DATA.cats.length)?DATA.cats:['外食','軽食','買い物','日用品','娯楽','交際費','食費','交通費','固定費','その他','未分類'];}

/* ===== 通信 ===== */
function setDot(cls,txt){$('dot').className='dot '+cls;$('syncTxt').textContent=txt;}

function apiGet(params){
  if(!CFG.url||!CFG.token) return Promise.reject(new Error('接続設定が未入力です'));
  var q='token='+encodeURIComponent(CFG.token);
  for(var k in params) q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  return fetch(CFG.url+'?'+q,{method:'GET',redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) throw new Error(j.error||'不明なエラー'); return j.data; });
}
function apiPost(body){
  if(!CFG.url||!CFG.token) return Promise.reject(new Error('接続設定が未入力です'));
  body.token=CFG.token;
  return fetch(CFG.url,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) throw new Error(j.error||'不明なエラー'); return j.data; });
}

function sync(silent){
  if(!CFG.url||!CFG.token){setDot('off','未接続');return Promise.resolve();}
  setDot('busy','同期中');
  var days=(CFG.days===0)?0:(CFG.days||90);
  var params={action:'list'};
  if(days>0){var from=new Date();from.setDate(from.getDate()-days);params.from=dayKey(from);}
  return flush()
    .then(function(){return apiGet(params);})
    .then(function(d){
      DATA={items:d.items||[],cats:d.categories||[],at:Date.now()};
      ls(K_CACHE,DATA);
      catDraft=null;
      setDot('','同期済 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
      renderAll();
      if(window.PlanApp) window.PlanApp.pull();
      if(!silent) toast('同期しました（'+DATA.items.length+'件）');
    })
    .catch(function(e){
      setDot('err','同期できません');
      if(!silent) toast(e.message);
    });
}

/* 未送信の操作をまとめて送る */
function flush(){
  if(!QUEUE.length) return Promise.resolve();
  var q=QUEUE.slice();
  return q.reduce(function(chain,op){
    return chain.then(function(){
      return apiPost(op).then(function(){
        QUEUE=QUEUE.filter(function(x){return x!==op;});
        ls(K_QUEUE,QUEUE);
      });
    });
  },Promise.resolve()).catch(function(){ /* 次回に持ち越す */ });
}
function queue(op){
  QUEUE.push(op);ls(K_QUEUE,QUEUE);
  flush().then(function(){ if(!QUEUE.length) setDot('','保存しました'); });
}

/* ===== データ操作（画面を先に更新し、送信は裏で） ===== */
function findItem(id){
  for(var i=0;i<DATA.items.length;i++) if(DATA.items[i].id===id) return DATA.items[i];
  return null;
}
function applyUpdate(id,patch){
  var it=findItem(id);if(!it)return;
  var sy=MAIN().scrollTop;
  if(patch.category!==undefined) it.category=patch.category;
  if(patch.use!==undefined) it.use=patch.use;
  if(patch.status!==undefined) it.status=patch.status;
  if(patch.date!==undefined) it.date=patch.date;
  if(patch.time!==undefined) it.time=patch.time;
  if(patch.amount!==undefined){
    if(patch.amount===''){it.amount=it.raw;it.edited=false;}
    else{it.amount=Number(patch.amount);it.edited=true;}
  }
  ls(K_CACHE,DATA);
  var op={action:'update',id:id};
  for(var k in patch) op[k]=patch[k];
  queue(op);
  renderAll();
  MAIN().scrollTop=sy;
}

/* ===== 画面切替 ===== */
function show(p){
  view.pane=p;
  document.querySelectorAll('.pane').forEach(function(el){el.classList.toggle('on',el.id==='p-'+p);});
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-current',b.dataset.p===p?'true':'false');});
  $('gearBtn').setAttribute('aria-current',p==='set'?'true':'false');
  /* 計画タブは URL の #plan/... で画面を切り替える。ほかのタブではハッシュを消す */
  if(p!=='plan'&&location.hash) history.replaceState(null,'',location.pathname+location.search);
  MAIN().scrollTop=0;
  renderHeader();
}
document.querySelector('nav').addEventListener('click',function(e){
  var b=e.target.closest('button[data-p]');if(!b)return;
  if(b.dataset.p==='plan'){
    if(view.pane==='plan') location.hash='#plan/home';
    else location.hash=window.PlanApp?window.PlanApp.lastRoute():'#plan/home';
    return;
  }
  show(b.dataset.p);
});
$('gearBtn').addEventListener('click',function(){show('set');});
$('syncBtn').addEventListener('click',function(){if(CFG.url&&CFG.token) sync(false);});

/* ===== 集計 ===== */
function monthItems(key){
  return DATA.items.filter(function(x){return x.date.slice(0,7)===key;});
}
function sum(list){return list.reduce(function(a,b){return a+(Number(b.amount)||0);},0);}
function pending(){return DATA.items.filter(function(x){return x.status!=='承認済';});}

/* ===== 描画 ===== */
function renderHeader(){
  var key=(view.pane==='chart')?view.gmonth:view.month;
  $('sumBox').classList.remove('neg','hide');
  if(view.pane==='plan'&&window.PlanApp){
    var h=window.PlanApp.header();
    $('sumLabel').textContent=h.label;
    $('sumVal').textContent=h.value;
    $('sumBox').classList.toggle('neg',h.neg);
    return;
  }
  if(view.pane==='approve'){
    $('sumLabel').textContent='未承認';
    $('sumVal').textContent=yen(sum(pending()));
  }else if(view.pane==='set'){
    $('sumLabel').textContent='設定';
    $('sumBox').classList.add('hide');
    return;
  }else{
    $('sumLabel').textContent=(+key.slice(5,7))+'月の支出';
    $('sumVal').textContent=yen(sum(monthItems(key)));
  }
}

function itemHtml(it,withChips){
  var h='<div class="item'+(it.status!=='承認済'?' pend':'')+'" data-id="'+esc(it.id)+'">';
  h+='<div class="top"><span class="shop">'+esc(it.use||it.shop||'(名称なし)')+'</span>';
  if(withChips){
    var av=(adrafts[it.id]!==undefined)?adrafts[it.id]:it.amount;
    h+='<input type="number" class="amtin'+(Number(av)!==Number(it.raw)?' chg':'')+
       '" data-a="1" inputmode="numeric" pattern="[0-9]*" value="'+esc(av)+'">';
  }else{
    h+='<span class="amt num">'+yen(it.amount)+'</span>';
  }
  h+='</div>';
  /* 時刻・決済手段・カテゴリの印は出さない（日付は見出しで、カテゴリはボタンの選択状態で分かる）。重複の疑いだけ知らせる */
  if(it.note&&it.note.indexOf('★')===0) h+='<span class="flag">重複かもしれません</span>';
  if(withChips){
    var dv=(drafts[it.id]!==undefined)?drafts[it.id]:(it.use||'');
    h+='<input type="text" class="rename" data-r="1" placeholder="名前を付ける" value="'+esc(dv)+'">';
    h+='<div class="chipwrap"><div class="chiprow">';
    h+='<button class="chip ok" data-ok="1">✓ 承認</button>';
    var cs=cats().filter(function(c){return c!=='未分類';});
    var open=(expanded[it.id]===true),TOP=4;
    cs.forEach(function(c,i){
      h+='<button class="chip'+((!open&&i>=TOP)?' hid':'')+'" data-cat="'+esc(c)+'"'+
         (c===it.category?' aria-pressed="true"':'')+'>'+esc(c)+'</button>';
    });
    if(cs.length>TOP)

/* 左スワイプで削除ボタンを出す */
(function(){
  var W=96,cur=null,x0=0,y0=0,base=0,lock=null;
  function slide(el){return el.querySelector('.slide');}
  function setX(el,x){slide(el).style.transform='translateX('+x+'px)';}
  function closeAll(except){
    document.querySelectorAll('#pendList .swipe').forEach(function(s){
      if(s!==except){s.classList.remove('dragging');setX(s,0);s._x=0;}
    });
  }
  var root=$('pendList');
  root.addEventListener('touchstart',function(e){
    var s=e.target.closest('.swipe');if(!s)return;
    if(e.target.closest('input'))return;
    cur=s;x0=e.touches[0].clientX;y0=e.touches[0].clientY;
    base=s._x||0;lock=null;
  },{passive:true});
  root.addEventListener('touchmove',function(e){
    if(!cur)return;
    var dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(lock===null){
      if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
      lock=(Math.abs(dx)>Math.abs(dy))?'x':'y';
      if(lock==='x'){closeAll(cur);cur.classList.add('dragging');}
    }
    if(lock!=='x')return;
    var x=Math.min(0,Math.max(-W*1.9,base+dx));
    setX(cur,x);
  },{passive:true});
  root.addEventListener('touchend',function(){
    if(!cur||lock!=='x'){cur=null;return;}
    var m=slide(cur).style.transform.match(/-?\d+(\.\d+)?/);
    var x=m?-Math.abs(parseFloat(m[0])):0;
    cur.classList.remove('dragging');
    if(x<=-W*1.6){
      var sw=cur,id=cur.dataset.id;
      cur=null;
      removeItem(id);
      setX(sw,-W);sw._x=-W;
      return;
    }
    if(x<=-W*0.45){setX(cur,-W);cur._x=-W;}
    else{setX(cur,0);cur._x=0;}
    cur=null;
  });
  root.addEventListener('click',function(e){
    if(e.target.closest('[data-del]'))return;
    closeAll(null);
  },true);
})();

function renderCal(){
  $('mLabel').textContent=monLabel(view.month);

  var pen=mi.filter(function(x){return x.status!=='承認済';});
  var pt=sum(pen);
  var days={};mi.forEach(function(it){days[it.date]=1;});
  var nd=Object.keys(days).length;
  $('calSum').innerHTML=
    '<div class="cs-main"><span class="v num">'+yen(tot)+'</span><span class="u">円</span>'+
    (pt?'<span class="cs-pend num">未承認 '+yen(pt)+'</span>':'')+'</div>'+
    '<div class="cs-sub num"><span>支出のあった日　<b>'+nd+'</b>日</span>'+
    '<span>1日あたり　<b>'+yen(nd?tot/nd:0)+'</b>円</span></div>';
  var y=+view.month.slice(0,4),m=+view.month.slice(5,7)-1;
  var first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  var byDay={},penDay={};
  monthItems(view.month).forEach(function(it){
    byDay[it.date]=(byDay[it.date]||0)+(Number(it.amount)||0);
    if(it.status!=='承認済') penDay[it.date]=(penDay[it.date]||0)+(Number(it.amount)||0);
  });
  var todayK=dayKey(new Date());
  var h='';
  ['日','月','火','水','木','金','土'].forEach(function(d,i){
    h+='<div class="dow'+(i===0?' s':i===6?' t':'')+'">'+d+'</div>';
  });
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    var k=dayKey(d),out=(d.getMonth()!==m);
    if(i>=35&&out) continue;
    h+='<div class="d'+(out?' out':'')+(k===todayK?' today':'')+(k===view.day?' sel':'')+'" data-d="'+k+'">'+
       '<div class="n">'+d.getDate()+'</div>'+
       (byDay[k]?'<div class="a num">'+yen(byDay[k])+
         (penDay[k]?'<span class="pn num">('+yen(penDay[k])+')</span>':'')+'</div>':'')+'</div>';
  }
  $('cal').innerHTML=h;
}

/* 円グラフの色（彩度を抑えた並び） */
var PIE_LIGHT=['#2e6b53','#a8692a','#3f6590','#9c4f62','#7d7a2c','#2f7487','#b0553a','#6a5c99','#5a7d3f','#8c6a3f','#6c7973'];
var PIE=PIE_LIGHT; /* 画面はいつも白ベース */

function renderChart(){
  $('gLabel').textContent=monLabel(view.gmonth);
  $('gType').innerHTML=
    '<button class="chip" data-t="pie" aria-pressed="'+(view.ctype==='pie')+'">円グラフ</button>'+
    '<button class="chip" data-t="bar" aria-pressed="'+(view.ctype==='bar')+'">棒グラフ</button>';

  var list=monthItems(view.gmonth),total=sum(list);
  var byCat={};
  list.forEach(function(it){byCat[it.category]=(byCat[it.category]||0)+(Number(it.amount)||0);});
  var arr=Object.keys(byCat).map(function(k){return [k,byCat[k]];}).sort(function(a,b){return b[1]-a[1];});

  if(!arr.length){
    $('pieWrap').innerHTML='';
    $('catBars').innerHTML='<div class="empty">データがありません</div>';
  }else if(view.ctype==='pie'){
    var cx=50,cy=50,RO=40,ri=15,seg='',lab='';
    var acc=0,anySel=!!view.cat;
    /* 返品でカテゴリ合計が0以下になることがある。扇はプラスのカテゴリだけで描く */
    var posTotal=arr.reduce(function(a,p){return a+(p[1]>0?p[1]:0);},0);
    arr.forEach(function(p,i){
      if(p[1]<=0) return;
      var frac=posTotal?p[1]/posTotal:0;
      var on=(p[0]===view.cat);
      var ro=on?RO+5:RO;
      var op=(anySel&&!on)?0.22:1;
      var a0=acc*Math.PI*2-Math.PI/2, a1=(acc+frac)*Math.PI*2-Math.PI/2;
      var mid=(a0+a1)/2;
      if(frac>=0.9999){
        seg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((ro+ri)/2)+'" fill="none" opacity="'+op+'" '+
             'stroke="'+PIE[i%PIE.length]+'" stroke-width="'+(ro-ri)+'" data-cat="'+esc(p[0])+'"></circle>';
      }else{
        var big=(a1-a0)>Math.PI?1:0;
        var x0=cx+ro*Math.cos(a0),y0=cy+ro*Math.sin(a0);
        var x1=cx+ro*Math.cos(a1),y1=cy+ro*Math.sin(a1);
        var x2=cx+ri*Math.cos(a1),y2=cy+ri*Math.sin(a1);
        var x3=cx+ri*Math.cos(a0),y3=cy+ri*Math.sin(a0);
        seg+='<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+
             ' A'+ro.toFixed(2)+' '+ro.toFixed(2)+' 0 '+big+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+
             ' L'+x2.toFixed(2)+' '+y2.toFixed(2)+
             ' A'+ri+' '+ri+' 0 '+big+' 0 '+x3.toFixed(2)+' '+y3.toFixed(2)+
             ' Z" fill="'+PIE[i%PIE.length]+'" opacity="'+op+'" data-cat="'+esc(p[0])+'"></path>';
      }
      /* 扇が十分な大きさのときだけ、内側にカテゴリ名を置く */
      if(frac>=0.06){
        var lr=(ro+ri)/2+1;
        lab+='<text class="plab'+(on?' on':'')+'" opacity="'+op+'" x="'+(cx+lr*Math.cos(mid)).toFixed(2)+
             '" y="'+(cy+lr*Math.sin(mid)+1.6).toFixed(2)+'">'+esc(p[0])+'</text>';
      }
      acc+=frac;
    });
    $('pieWrap').innerHTML='<div class="pie-wrap"><svg class="pie" viewBox="-2 -2 104 104">'+
      seg+lab+'</svg></div>'+
      '';
    $('catBars').innerHTML=arr.map(function(p,i){
      var pct=total?Math.round(p[1]/total*1000)/10:0;
      return '<div class="leg'+(p[0]===view.cat?' sel':'')+'" data-cat="'+esc(p[0])+'">'+
             '<span class="sw" style="background:'+PIE[i%PIE.length]+'"></span>'+
             '<span class="nm">'+esc(p[0])+'</span>'+
             '<span class="va num">'+yen(p[1])+'</span>'+
             '<span class="pc num">'+pct+'%</span></div>';
    }).join('');
  }else{
    $('pieWrap').innerHTML='';
    $('catBars').innerHTML=arr.map(function(p,i){
      var pct=total?Math.round(p[1]/total*1000)/10:0;
      return '<div class="bar'+(p[0]===view.cat?' sel':'')+'" data-cat="'+esc(p[0])+'">'+
             '<div class="r1"><span>'+esc(p[0])+'</span>'+
             '<span class="num">'+yen(p[1])+'<span class="p"> '+pct+'%</span></span></div>'+
             '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+PIE[i%PIE.length]+'"></div></div></div>';
    }).join('');
  }

  var byMon={};
  DATA.items.forEach(function(it){var k=it.date.slice(0,7);byMon[k]=(byMon[k]||0)+(Number(it.amount)||0);});
  var mk=Object.keys(byMon).sort().slice(-6);
  var max=Math.max.apply(null,mk.map(function(k){return byMon[k];}).concat([1]));
  $('monBars').innerHTML=mk.length?mk.map(function(k){
    var w=Math.round(byMon[k]/max*100);
    return '<div class="bar"><div class="r1"><span class="num">'+monLabel(k)+'</span>'+
           '<span class="num">'+yen(byMon[k])+'</span></div>'+
           '<div class="track"><div class="fill" style="width:'+w+'%"></div></div></div>';
  }).join(''):'<div class="empty">データがありません</div>';
}

/* ===== 起動 ===== */
/* iOSで画面高さが実際より短く計算されることがあるので実測して合わせる */
function fitHeight(){
  var h=window.innerHeight||0;
  var c=document.documentElement.clientHeight||0;
  var v=(window.visualViewport&&window.visualViewport.height)||0;
  h=Math.max(h,c,v);
  if(h>0) document.documentElement.style.setProperty('--appH',h+'px');
}

window.addEventListener('resize',fitHeight);

/* iOS のホーム画面アプリでは、キーボードを閉じたあと画面の高さが縮んだまま戻らず、
   下のナビが浮いて下に空白ができることがある。閉じたら高さを測り直させる */
var maxH=Math.max(window.innerHeight||0,document.documentElement.clientHeight||0);
window.addEventListener('resize',function(){
  if(!isTyping()) maxH=Math.max(maxH,window.innerHeight||0);
});
function isTyping(){
  var a=document.activeElement;
  while(a&&a.shadowRoot&&a.shadowRoot.activeElement) a=a.shadowRoot.activeElement;
  return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'));
}
function healViewport(){
  if(isTyping()) return;
  if(window.scrollY) window.scrollTo(0,0);
  if(maxH-(window.innerHeight||0)<=4){fitHeight();return;}
  var sy=MAIN().scrollTop;
  document.body.style.display='none';
  void document.body.offsetHeight;
  document.body.style.display='';
  MAIN().scrollTop=sy;
  fitHeight();
}
